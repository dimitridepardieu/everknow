services:
  api:
    init: true
    build:
      target: dev
      args:
        AIR_VERSION: ${AIR_VERSION}
    environment:
      # Only consumed by `go test`. Merged with (not replacing) the base
      # environment declared in compose.yaml.
      - TEST_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${TEST_POSTGRES_DB}?sslmode=disable
    volumes:
      - ../api:/app
    ports:
      - "${DEV_HOST:-127.0.0.1}:${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    init: true
    build:
      target: dev
    volumes:
      - ../web:/app
      - ./web/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  postgres:
    ports:
      - "${DEV_HOST:-127.0.0.1}:5432:5432"

  caddy:
    volumes:
      - ./caddy/frontend.dev.caddy:/etc/caddy/frontend.caddy:ro
    ports:
      - "${DEV_HOST:-127.0.0.1}:80:80"
      - "${DEV_HOST:-127.0.0.1}:443:443"
      - "${DEV_HOST:-127.0.0.1}:443:443/udp"
    depends_on:
      - api
      - web

