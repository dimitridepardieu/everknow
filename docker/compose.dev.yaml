services:
  api:
    init: true
    build:
      target: dev
    volumes:
      - ../api:/app
    ports:
      - "${API_PORT}:8080"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  web:
    init: true
    build:
      target: dev
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
      - ./web-entrypoint.sh:/app/docker-entrypoint.sh:ro
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  postgres:
    ports:
      - "5432:5432"

  caddy:
    volumes:
      - ./frontend.dev.caddy:/etc/caddy/frontend.caddy:ro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - api
      - web

volumes:
  web_node_modules:
