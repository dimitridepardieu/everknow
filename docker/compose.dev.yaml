services:
  api:
    volumes:
      - ../api:/app
    command: go run .
    ports:
      - "${API_PORT}:8080"
    environment:
      - DATABASE_URL=postgres://flashcard:flashcard@postgres:5432/flashcardacademy?sslmode=disable
    depends_on:
      - postgres

  web:
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    command: bun run dev --host 0.0.0.0
    ports:
      - "${WEB_PORT}:5173"
    environment:
      - VITE_API_URL=http://localhost:${API_PORT}

  postgres:
    ports:
      - "5432:5432"

volumes:
  web_node_modules:
