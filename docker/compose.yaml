name: ${PROJECT_CODENAME}

services:
  api:
    build:
      context: ../api
      dockerfile: ../docker/api/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    container_name: ${PROJECT_CODENAME}-api
    environment:
      - APP_ENV=${APP_ENV}
      - API_PORT=${API_PORT}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - APP_BASE_URL=${APP_BASE_URL}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS}
      - MAGIC_LINK_TTL_MINUTES=${MAGIC_LINK_TTL_MINUTES}
    networks:
      - public
      - private

  web:
    build:
      context: ../web
      dockerfile: ../docker/web/Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION}
    container_name: ${PROJECT_CODENAME}-web
    networks:
      - public

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: ${PROJECT_CODENAME}-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # TODO (prod): migrate to Docker secrets (POSTGRES_PASSWORD_FILE)
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:${CADDY_VERSION}-alpine
    container_name: ${PROJECT_CODENAME}-caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    networks:
      - public

networks:
  public:
  private:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
